site_name: dbx-dash
site_description: Terminal dashboard for monitoring Databricks workspaces
site_url: https://tttao.github.io/dbx-dash
repo_url: https://github.com/tttao/dbx-dash
repo_name: tttao/dbx-dash

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Installation: install.md
  - Usage: usage.md
  - Configuration: configuration.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
