name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          GOOS=linux  GOARCH=amd64 go build -ldflags="-X main.version=${GITHUB_REF_NAME}" -o dbx-dash-linux-amd64   ./cmd/dbx-dash
          GOOS=darwin GOARCH=amd64 go build -ldflags="-X main.version=${GITHUB_REF_NAME}" -o dbx-dash-darwin-amd64  ./cmd/dbx-dash
          GOOS=darwin GOARCH=arm64 go build -ldflags="-X main.version=${GITHUB_REF_NAME}" -o dbx-dash-darwin-arm64  ./cmd/dbx-dash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dbx-dash-linux-amd64
            dbx-dash-darwin-amd64
            dbx-dash-darwin-arm64
